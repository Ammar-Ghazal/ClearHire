<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearHire</title>
    <script>
      // Theme before first paint, so there is no flash: the stored choice, else the system setting.
      // Keep the key in sync with THEME_KEY in src/components/ThemeToggle.tsx.
      try {
        const stored = localStorage.getItem('clearhire-theme');
        const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
