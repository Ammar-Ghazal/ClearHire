services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clearhire
      POSTGRES_PASSWORD: clearhire
      POSTGRES_DB: clearhire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearhire"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
