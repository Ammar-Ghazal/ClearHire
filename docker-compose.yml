services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hireproof
      POSTGRES_PASSWORD: hireproof
      POSTGRES_DB: hireproof
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireproof"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
